<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Manrope:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
        
        body {
            font-family: 'Pretendard', 'Manrope', sans-serif;
            line-height: 1.8;
            word-break: keep-all;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .editorial-gradient {
            background: linear-gradient(135deg, #006195 0%, #007aba 100%);
        }

        .glass-panel {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.8);
        }

        .dark .glass-panel {
            background: rgba(22, 28, 35, 0.8);
        }

        .auth-card-shadow {
            box-shadow: 0 10px 30px -5px rgba(0, 97, 149, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.03);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-lowest": "#ffffff",
                        "background": "#f7f9ff",
                        "on-surface-variant": "#3f4850",
                        "surface-container-low": "#eff4fd",
                        "surface": "#f7f9ff",
                        "primary-container": "#007aba",
                        "primary": "#006195",
                        "secondary": "#006c4d",
                        "on-surface": "#161c23",
                        "outline-variant": "#bfc7d2",
                        "error": "#ba1a1a",
                        "surface-container-high": "#e3e8f2",
                        "surface-container-highest": "#dde3ec"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "20px",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background dark:bg-neutral-950 text-on-surface selection:bg-primary-container selection:text-on-primary-container">
<main class="min-h-screen flex flex-col md:flex-row">
<!-- Left: Brand Panel (55%) -->
<section class="hidden md:flex md:w-[55%] editorial-gradient relative overflow-hidden flex-col justify-between p-16">
<!-- Decorative Elements -->
<div class="absolute top-[-10%] right-[-10%] w-96 h-96 bg-white/10 rounded-full blur-3xl"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-64 h-64 bg-secondary/20 rounded-full blur-2xl"></div>
<!-- Brand Header -->
<div class="relative z-10">
<div class="flex items-center gap-2">
<div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
</div>
<span class="text-3xl font-black tracking-tight text-white font-headline">Chatsio</span>
</div>
</div>
<!-- Main Content Area -->
<div class="relative z-10">
<h1 class="text-5xl font-bold text-white leading-tight mb-8 font-headline">
                    AI가 상품 데이터를<br/>구조화하는 가장 쉬운 방법
                </h1>
<!-- Illustration Placeholder Card -->
<div class="bg-white/10 backdrop-blur-md rounded-2xl p-8 border border-white/10 shadow-2xl">
<div class="flex items-center justify-between gap-6">
<!-- Product Attributes -->
<div class="flex-1 space-y-3">
<div class="h-4 w-3/4 bg-white/20 rounded-full"></div>
<div class="h-4 w-1/2 bg-white/20 rounded-full"></div>
<div class="h-4 w-5/6 bg-white/20 rounded-full"></div>
</div>
<!-- Conversion Arrow -->
<div class="flex items-center justify-center">
<span class="material-symbols-outlined text-white text-4xl animate-pulse">forward</span>
</div>
<!-- JSON-LD Preview -->
<div class="flex-1 bg-on-surface/90 rounded-xl p-4 font-mono text-[10px] text-primary-container">
<p class="opacity-80">"@context": "schema.org",</p>
<p class="opacity-80">"type": "Product",</p>
<p class="text-white">"color": "Deep Blue",</p>
<p class="text-white">"material": "97% Cotton"</p>
</div>
</div>
<!-- Contextual Image Support -->
<div class="mt-8 overflow-hidden rounded-xl h-48 relative">
<img class="w-full h-full object-cover opacity-60" data-alt="Modern minimalist aesthetic of professional digital workspace with clean lines and soft blue editorial lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD5QRIhoOjDdX_cUDchjsiI192fjIOMg6t01_RG97C1Mj32Sw8p-Bn14qaxnGVoIgpYmTCQ_ZzngwK2Rjw-4FQFmg3V-V_i-oQHge2GgftR0FwJwqN-zpfYvfVCW6O8AYxH-LlopsLQ9Qp4LejlT7AycwVTneuHqaXeDL-TNU_edNe8pHz4SCd23b6CXK5uUd8jpkYAYrMNWGdyuBQfX1APNwTJZyUkDYrm4gkLgnSlqyn97M2V25VTPW97o7RgIJ4lKmpsB6fQSZNR"/>
<div class="absolute inset-0 bg-gradient-to-t from-primary/80 to-transparent flex items-end p-4">
<p class="text-white text-sm font-medium">데이터 구조화 프로세스 자동화</p>
</div>
</div>
</div>
</div>
<!-- Bottom Badge -->
<div class="relative z-10 flex items-center gap-3">
<div class="px-4 py-2 bg-secondary text-white rounded-full text-sm font-bold flex items-center gap-2">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">verified</span>
                    의류 속성 97.3% 정확도
                </div>
<p class="text-white/60 text-xs">Based on 2024 Editorial Tech Benchmark</p>
</div>
</section>
<!-- Right: Auth Panel (45%) -->
<section class="flex-1 flex flex-col justify-center items-center p-6 md:p-12 bg-neutral-50 dark:bg-neutral-950">
<div class="w-full max-w-md">
<!-- Mobile Logo (Visible only on mobile) -->
<div class="md:hidden flex items-center justify-center gap-2 mb-10">
<span class="text-2xl font-black tracking-tight text-primary font-headline">Chatsio</span>
</div>
<!-- Auth Card -->
<div class="bg-surface-container-lowest dark:bg-neutral-900 rounded-2xl p-10 auth-card-shadow border border-outline-variant/10">
<!-- Tabs -->
<div class="flex gap-8 mb-10 border-b border-outline-variant/20 relative">
<button class="pb-4 text-lg font-bold text-primary dark:text-primary-container relative group">
                            로그인
                            <div class="absolute bottom-[-1px] left-0 w-full h-1 bg-primary rounded-t-full"></div>
</button>
<button class="pb-4 text-lg font-medium text-on-surface-variant hover:text-on-surface transition-colors">
                            회원가입
                        </button>
</div>
<!-- Login Form -->
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="text-sm font-semibold text-on-surface">이메일</label>
<div class="relative">
<input class="w-full px-4 py-3.5 bg-surface-container dark:bg-neutral-800 border-none rounded-xl focus:ring-2 focus:ring-primary transition-all placeholder:text-on-surface-variant/40" placeholder="example@chatsio.ai" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="text-sm font-semibold text-on-surface">비밀번호</label>
<a class="text-xs font-medium text-primary hover:underline" href="#">비밀번호를 잊으셨나요?</a>
</div>
<div class="relative">
<input class="w-full px-4 py-3.5 bg-surface-container dark:bg-neutral-800 border-none rounded-xl focus:ring-2 focus:ring-primary transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60 hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="w-full py-4 editorial-gradient text-white font-bold rounded-xl shadow-lg hover:shadow-primary/20 active:scale-[0.98] transition-all flex justify-center items-center gap-2" type="submit">
<span>로그인</span>
</button>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="flex-1 h-[1px] bg-outline-variant/30"></div>
<span class="text-xs font-medium text-on-surface-variant/50">또는</span>
<div class="flex-1 h-[1px] bg-outline-variant/30"></div>
</div>
<!-- Google Login -->
<button class="w-full py-4 bg-transparent border-2 border-outline-variant/30 text-on-surface font-semibold rounded-xl hover:bg-surface-container transition-colors flex items-center justify-center gap-3" type="button">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAp5asuMbB6sDFlkIq_RJstF3Y7nGGXLSvlkf3pjibPzU8YYGBo6nP_XgbmfsUcH99aKUkCQN5BBTrM-QVX_bFebyQJMj29mkbI6HUhsGFoQpp3Cat2ouIUwJhQPr6OxPbL5QsLK3LxHgyeFhtlNOZIVgM3f6tEGvd-c6d39iGTMtc2CO0lw3xHceELxwxqynVM7_LFIRY17IbA0wfe_WcjrwmdaF1dJmEZQWU-QGDgJqseq3TNeBm9h5QC1mW7KaOJ7afH4j82abG6"/>
<span>Google로 계속하기</span>
</button>
</form>
</div>
<!-- Footer Links -->
<footer class="mt-8 flex justify-center gap-6">
<a class="text-xs text-on-surface-variant/60 hover:text-primary transition-colors" href="#">이용약관</a>
<a class="text-xs text-on-surface-variant/60 hover:text-primary transition-colors" href="#">개인정보처리방침</a>
<a class="text-xs text-on-surface-variant/60 hover:text-primary transition-colors" href="#">고객지원</a>
</footer>
</div>
</section>
</main>
<!-- Hidden State Sample (Signup Preview Concept) -->
<!-- This part of the code is for reference of interaction states as requested -->
<div class="hidden">
<!-- Error State Input -->
<input class="border-2 border-error focus:ring-error"/>
<p class="text-error text-xs mt-1">올바른 이메일 형식이 아닙니다.</p>
<!-- Password Strength (For Signup) -->
<div class="w-full h-1 bg-surface-container rounded-full mt-2">
<div class="w-2/3 h-full bg-secondary rounded-full"></div>
</div>
<!-- Loading State Button -->
<button class="opacity-70 cursor-not-allowed" disabled="">
<svg class="animate-spin h-5 w-5 mr-3" viewbox="0 0 24 24"></svg>
            처리 중...
        </button>
</div>
</body></html>
